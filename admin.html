<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#223A5E">
<link rel="icon" href="favicon.png">
<title>Kaarigar — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --wall:#EDE7D9; --paper:#FAF6EC; --ink:#211D18; --ink-soft:#5B5348;
    --mustard:#E8A63B; --signal:#BF3B2C; --teal:#1B6B68; --leaf:#5C7A4E; --navy:#223A5E;
    --line: rgba(33,29,24,0.14); --radius: 10px;
  }
  *{box-sizing:border-box;}
  html{overflow-x:hidden;}
  body{margin:0;background:var(--wall);color:var(--ink);font-family:'Inter',sans-serif;line-height:1.5;overflow-x:hidden;width:100%;}
  h1,h2,h3{font-family:'Baloo 2',sans-serif;font-weight:700;margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;letter-spacing:0.03em;text-transform:uppercase;font-size:0.7rem;font-weight:600;}
  button{font-family:inherit;}

  header{background:var(--navy);color:var(--paper);padding:20px 24px;max-width:100%;}
  header h1{font-size:1.3rem;}
  header p{margin:4px 0 0;color:rgba(250,246,236,0.75);font-size:0.85rem;}

  .content{max-width:900px;margin:0 auto;padding:24px;overflow-x:hidden;}
  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-soft);}
  .empty-state .e-icon{font-size:2.2rem;margin-bottom:10px;}

  .filters{display:flex;gap:10px;margin-bottom:20px;}
  .filter-btn{
    padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
    font-weight:600;font-size:0.85rem;cursor:pointer;color:var(--ink-soft);
  }
  .filter-btn[aria-selected="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .complaint-card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:20px;margin-bottom:16px;
  }
  .complaint-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:14px;flex-wrap:wrap;gap:8px;}
  .status-badge{padding:5px 12px;border-radius:999px;font-size:0.74rem;font-weight:700;text-transform:uppercase;}
  .status-pending{background:rgba(232,166,59,0.2);color:#8A5D14;}
  .status-suspended{background:rgba(191,59,44,0.14);color:var(--signal);}
  .status-dismissed{background:rgba(91,83,72,0.14);color:var(--ink-soft);}

  .party-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:14px;}
  @media(max-width:600px){.party-grid{grid-template-columns:1fr;}}
  .party{background:var(--wall);border-radius:8px;padding:14px;}
  .party .role-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;color:var(--ink-soft);margin-bottom:6px;}
  .party strong{display:block;font-family:'Baloo 2',sans-serif;font-size:1rem;}
  .party span{display:block;color:var(--ink-soft);font-size:0.85rem;margin-top:2px;}
  .party.flagged{border:2px solid var(--signal);}

  .job-line{font-size:0.9rem;color:var(--ink-soft);margin-bottom:8px;}
  .reason-box{background:var(--wall);border-radius:8px;padding:12px 14px;font-size:0.88rem;margin-bottom:14px;}
  .reason-box .label{font-weight:700;font-size:0.78rem;text-transform:uppercase;color:var(--ink-soft);display:block;margin-bottom:4px;}

  .actions{display:flex;gap:10px;flex-wrap:wrap;}
  .btn{padding:10px 16px;border-radius:7px;border:none;font-weight:600;font-size:0.85rem;cursor:pointer;}
  .btn-suspend{background:var(--signal);color:var(--paper);}
  .btn-suspend:hover{background:var(--ink);}
  .btn-dismiss{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-dismiss:hover{border-color:var(--ink);}
  .btn-unsuspend{background:var(--leaf);color:var(--paper);}
  .btn-unsuspend:hover{background:var(--ink);}

  .gate{max-width:420px;margin:80px auto;text-align:center;padding:0 24px;}
  .gate h2{margin-bottom:10px;}
  .gate p{color:var(--ink-soft);margin-bottom:20px;}
  .gate .btn{background:var(--ink);color:var(--paper);padding:14px 24px;}

  /* ---------- Admin tabs & new panels ---------- */
  .admin-tabs{display:flex;gap:8px;margin-bottom:22px;overflow-x:auto;padding-bottom:2px;}
  .admin-tab-btn{
    padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--paper);
    font-weight:700;font-size:0.85rem;cursor:pointer;color:var(--ink-soft);white-space:nowrap;flex-shrink:0;
  }
  .admin-tab-btn[aria-selected="true"]{background:var(--navy);color:var(--paper);border-color:var(--navy);}
  .admin-panel{display:none;}
  .admin-panel.active{display:block;}

  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:26px;}
  .stat-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;}
  .stat-card .stat-label{color:var(--ink-soft);font-size:0.78rem;font-weight:600;margin-bottom:6px;}
  .stat-card .stat-value{font-family:'Baloo 2',sans-serif;font-size:1.5rem;font-weight:700;}

  .toolbar{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap;align-items:center;}
  .search-input{
    flex:1;min-width:200px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);
    background:var(--paper);font-size:0.9rem;
  }
  .search-input:focus{outline:2px solid var(--navy);}

  .data-card{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:16px 18px;margin-bottom:12px;
  }
  .data-card.suspended{border-color:var(--signal);}
  .data-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;margin-bottom:10px;}
  .data-name{font-family:'Baloo 2',sans-serif;font-size:1.05rem;font-weight:700;}
  .data-sub{color:var(--ink-soft);font-size:0.82rem;margin-top:2px;}
  .data-meta{display:flex;flex-wrap:wrap;gap:14px;font-size:0.85rem;color:var(--ink-soft);margin-bottom:12px;}
  .data-meta b{color:var(--ink);font-weight:700;}
  .pill{padding:3px 10px;border-radius:999px;font-size:0.7rem;font-weight:700;text-transform:uppercase;}
  .pill-verified{background:rgba(27,107,104,0.16);color:var(--teal);}
  .pill-unverified{background:rgba(91,83,72,0.12);color:var(--ink-soft);}
  .pill-online{background:rgba(92,122,78,0.18);color:var(--leaf);}
  .pill-offline{background:rgba(91,83,72,0.12);color:var(--ink-soft);}
  .pill-suspended{background:rgba(191,59,44,0.14);color:var(--signal);}

  .btn-sm{padding:8px 14px;border-radius:7px;border:none;font-weight:600;font-size:0.8rem;cursor:pointer;}
  .btn-navy{background:var(--navy);color:var(--paper);}
  .btn-navy:hover{background:var(--ink);}
  .btn-danger{background:var(--signal);color:var(--paper);}
  .btn-danger:hover{background:#8a2318;}
  .btn-ghost{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--ink);}

  .pw-modal-overlay{
    position:fixed;inset:0;background:rgba(33,29,24,0.55);display:none;
    align-items:center;justify-content:center;z-index:200;padding:20px;
  }
  .pw-modal-overlay.open{display:flex;}
  .pw-modal-box{
    background:var(--paper);border-radius:12px;max-width:380px;width:100%;
    padding:26px;box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .pw-modal-box h3{font-size:1.1rem;margin-bottom:8px;}
  .pw-modal-box p{color:var(--ink-soft);font-size:0.85rem;margin-bottom:16px;}
  .pw-modal-box input{
    width:100%;padding:12px 14px;border-radius:8px;border:2px solid var(--line);
    font-size:1rem;margin-bottom:10px;
  }
  .pw-modal-error{color:var(--signal);font-size:0.82rem;margin-bottom:10px;display:none;}
  .pw-modal-actions{display:flex;gap:10px;justify-content:flex-end;}

  .booking-row{
    background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:10px;
  }
  .booking-row .bk-info{flex:1;min-width:220px;font-size:0.88rem;}
  .booking-row .bk-info strong{font-family:'Baloo 2',sans-serif;}
  .booking-row .bk-price{font-family:'IBM Plex Mono',monospace;font-weight:600;}

  /* verification status pills */
  .pill-status-incomplete{background:rgba(91,83,72,0.12);color:var(--ink-soft);}
  .pill-status-pending{background:rgba(232,166,59,0.2);color:#8A5D14;}
  .pill-status-verified{background:rgba(92,122,78,0.18);color:var(--leaf);}
  .pill-status-rejected{background:rgba(191,59,44,0.14);color:var(--signal);}

  /* inline edit form on customer/worker cards */
  .edit-form{background:var(--wall);border-radius:8px;padding:14px;margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .edit-form.wide-field{grid-column:1/-1;}
  @media(max-width:600px){.edit-form{grid-template-columns:1fr;}}
  .edit-form label{font-size:0.78rem;font-weight:700;color:var(--ink-soft);display:block;margin-bottom:4px;}
  .edit-form input,.edit-form textarea{width:100%;padding:9px 11px;border-radius:7px;border:1px solid var(--line);font-size:0.88rem;font-family:inherit;background:var(--paper);}
  .edit-form textarea{grid-column:1/-1;min-height:60px;resize:vertical;}
  .edit-form .edit-actions{grid-column:1/-1;display:flex;gap:8px;}

  /* verification queue card */
  .verify-card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-bottom:14px;}
  .verify-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;font-size:0.88rem;color:var(--ink-soft);margin:12px 0;}
  @media(max-width:600px){.verify-grid{grid-template-columns:1fr;}}
  .verify-grid b{color:var(--ink);}
  .doc-link{display:inline-block;margin-top:4px;color:var(--navy);font-weight:700;text-decoration:underline;cursor:pointer;font-size:0.85rem;}
  .btn-approve{background:var(--leaf);color:var(--paper);}
  .btn-approve:hover{background:var(--ink);}
  .btn-reject{background:var(--signal);color:var(--paper);}
  .btn-reject:hover{background:var(--ink);}
</style>
</head>
<body>

<header style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
  <div>
    <h1>🛡️ Kaarigar Admin</h1>
    <p>Manage customers, workers, bookings & complaints</p>
  </div>
  <button id="logoutBtn" style="display:none;background:none;border:1px solid rgba(250,246,236,0.4);color:var(--paper);padding:9px 16px;border-radius:7px;font-weight:600;font-size:0.85rem;cursor:pointer;">Log out</button>
</header>

<div class="content" id="mainContent">
  <div class="gate">
    <h2>Checking access…</h2>
  </div>
</div>

<div class="content" id="adminApp" style="display:none;">
  <div class="admin-tabs">
    <button class="admin-tab-btn" data-tab="overview" aria-selected="true">Overview</button>
    <button class="admin-tab-btn" data-tab="verification" aria-selected="false">Verification <span id="verifyCount" class="nav-count" style="display:none;background:var(--signal);color:var(--paper);font-size:0.68rem;font-weight:700;padding:1px 7px;border-radius:999px;margin-left:4px;"></span></button>
    <button class="admin-tab-btn" data-tab="customers" aria-selected="false">Customers</button>
    <button class="admin-tab-btn" data-tab="workers" aria-selected="false">Workers</button>
    <button class="admin-tab-btn" data-tab="bookings" aria-selected="false">Bookings</button>
    <button class="admin-tab-btn" data-tab="complaints" aria-selected="false">Complaints</button>
  </div>

  <div class="admin-panel active" id="panel-overview"></div>
  <div class="admin-panel" id="panel-verification"></div>
  <div class="admin-panel" id="panel-customers"></div>
  <div class="admin-panel" id="panel-workers"></div>
  <div class="admin-panel" id="panel-bookings"></div>
  <div class="admin-panel" id="panel-complaints"></div>
</div>

<!-- ================= PASSWORD CONFIRM MODAL (for destructive actions) ================= -->
<div class="pw-modal-overlay" id="pwModalOverlay">
  <div class="pw-modal-box">
    <h3 id="pwModalTitle">Confirm it's you</h3>
    <p id="pwModalMessage">Re-enter your admin password to continue.</p>
    <input type="password" id="pwModalInput" placeholder="Admin password" autocomplete="current-password">
    <div class="pw-modal-error" id="pwModalError"></div>
    <div class="pw-modal-actions">
      <button class="btn-sm btn-ghost" id="pwModalCancel">Cancel</button>
      <button class="btn-sm btn-danger" id="pwModalConfirm">Confirm</button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  // ============================================================
  // BACKEND CONFIG — must match your other pages
  // ============================================================
  const SUPABASE_URL = 'https://wbygseregfnudvuhxklb.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndieWdzZXJlZ2ZudWR2dWh4a2xiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQyNTc3NjIsImV4cCI6MjA5OTgzMzc2Mn0.6VlGmBR1nt0CXPClMDRgbtTiVfPl7cim2rgEvkl23Fs';
  const BACKEND_READY = SUPABASE_URL !== 'YOUR_SUPABASE_URL' && SUPABASE_ANON_KEY !== 'YOUR_SUPABASE_ANON_KEY';
  const supabaseClient = BACKEND_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
</script>
<script>
(function(){
  const mainContent = document.getElementById('mainContent');
  const adminApp = document.getElementById('adminApp');
  let complaints = [];
  let activeFilter = 'pending';

  // ---------- New state for Overview / Customers / Workers / Bookings ----------
  let stats = null;
  let customers = [];
  let workersList = [];
  let bookingsList = [];
  let customerSearch = '';
  let workerSearch = '';
  let bookingStatusFilter = 'all';

  function renderGate(html){
    adminApp.style.display = 'none';
    mainContent.style.display = '';
    mainContent.innerHTML = '<div class="gate">' + html + '</div>';
  }

  function fmtDate(d){
    if(!d) return '—';
    return new Date(d).toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
  }
  function fmtMoney(n){
    return '₹' + Number(n || 0).toLocaleString('en-IN');
  }
  function isSuspended(until){
    return until && new Date(until) > new Date();
  }

  // ============================================================
  // TAB SWITCHING
  // ============================================================
  document.querySelectorAll('.admin-tab-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      document.querySelectorAll('.admin-tab-btn').forEach(b => b.setAttribute('aria-selected','false'));
      btn.setAttribute('aria-selected','true');
      document.querySelectorAll('.admin-panel').forEach(p => p.classList.remove('active'));
      const tab = btn.dataset.tab;
      document.getElementById('panel-' + tab).classList.add('active');
      await loadTab(tab);
    });
  });

  async function loadTab(tab){
    if(tab === 'overview') await loadStats();
    if(tab === 'verification') await loadVerificationQueue();
    if(tab === 'customers') await loadCustomers();
    if(tab === 'workers') await loadWorkers();
    if(tab === 'bookings') await loadBookings();
    if(tab === 'complaints') await loadComplaints();
  }

  // ============================================================
  // OVERVIEW
  // ============================================================
  async function loadStats(){
    const panel = document.getElementById('panel-overview');
    panel.innerHTML = '<p style="color:var(--ink-soft);">Loading…</p>';
    const { data, error } = await supabaseClient.rpc('admin_get_stats');
    if(error){
      panel.innerHTML = '<p style="color:var(--signal);">Could not load stats: ' + error.message + '</p>';
      return;
    }
    stats = Array.isArray(data) ? data[0] : data;
    renderStats();
  }

  function renderStats(){
    const s = stats || {};
    updateVerifyBadge(s.pending_verifications || 0);
    document.getElementById('panel-overview').innerHTML = `
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-label">Total customers</div><div class="stat-value">${s.total_customers ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Total workers</div><div class="stat-value">${s.total_workers ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Suspended customers</div><div class="stat-value">${s.suspended_customers ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Suspended workers</div><div class="stat-value">${s.suspended_workers ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Total bookings</div><div class="stat-value">${s.total_bookings ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Pending bookings</div><div class="stat-value">${s.pending_bookings ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Completed bookings</div><div class="stat-value">${s.completed_bookings ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Pending complaints</div><div class="stat-value">${s.pending_complaints ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Awaiting verification</div><div class="stat-value">${s.pending_verifications ?? 0}</div></div>
        <div class="stat-card"><div class="stat-label">Total collected</div><div class="stat-value">${fmtMoney(s.total_collected)}</div></div>
      </div>
    `;
  }

  function updateVerifyBadge(count){
    const el = document.getElementById('verifyCount');
    el.textContent = count;
    el.style.display = count > 0 ? 'inline-block' : 'none';
  }

  // ============================================================
  // VERIFICATION QUEUE
  // ============================================================
  let verificationQueue = [];

  async function loadVerificationQueue(){
    const panel = document.getElementById('panel-verification');
    panel.innerHTML = '<p style="color:var(--ink-soft);">Loading…</p>';
    const { data, error } = await supabaseClient.rpc('admin_get_verification_queue');
    if(error){
      panel.innerHTML = '<p style="color:var(--signal);">Could not load verification queue: ' + error.message + '</p>';
      return;
    }
    verificationQueue = data || [];
    updateVerifyBadge(verificationQueue.length);
    renderVerificationQueue();
  }

  function verifyCard(v){
    return `
      <div class="verify-card">
        <div class="data-top">
          <div>
            <div class="data-name">${v.name || '—'}</div>
            <div class="data-sub">${v.role === 'worker' ? '🧰 Worker' : '🙋 Customer'} · Submitted ${fmtDate(v.verification_submitted_at)}</div>
          </div>
          <span class="pill pill-status-pending">Pending review</span>
        </div>
        <div class="verify-grid">
          <span>📧 <b>${v.email || '—'}</b></span>
          <span>📞 <b>${v.phone || '—'}</b></span>
          <span>🎂 DOB <b>${fmtDate(v.dob)}</b></span>
          <span>🏠 <b>${v.address || '—'}</b></span>
        </div>
        ${v.id_document_path
          ? `<a class="doc-link" data-view-doc="${v.id_document_path}">📄 View uploaded ID document</a>`
          : '<span style="color:var(--signal);font-size:0.85rem;">No ID document on file</span>'}
        <br>
        ${v.live_photo_path
          ? `<a class="doc-link" data-view-doc="${v.live_photo_path}">🤳 View live selfie</a>`
          : '<span style="color:var(--signal);font-size:0.85rem;">No live photo on file</span>'}
        <div class="actions" style="margin-top:14px;">
          <button class="btn btn-approve" data-approve="${v.profile_id}">Approve</button>
          <button class="btn btn-reject" data-reject="${v.profile_id}">Reject</button>
        </div>
      </div>`;
  }

  function renderVerificationQueue(){
    const panel = document.getElementById('panel-verification');
    panel.innerHTML = verificationQueue.length
      ? verificationQueue.map(verifyCard).join('')
      : '<div class="empty-state"><div class="e-icon">✅</div><p>No profiles waiting for verification.</p></div>';

    panel.querySelectorAll('[data-view-doc]').forEach(link => {
      link.addEventListener('click', async () => {
        const { data, error } = await supabaseClient
          .storage.from('verification-docs')
          .createSignedUrl(link.dataset.viewDoc, 300);
        if(error){ alert('Could not open document: ' + error.message); return; }
        window.open(data.signedUrl, '_blank');
      });
    });
    panel.querySelectorAll('[data-approve]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Approve this profile? They will get full access to the app.')) return;
        const { error } = await supabaseClient.rpc('admin_review_verification', {
          p_profile_id: btn.dataset.approve, p_approve: true, p_note: null
        });
        if(error){ alert('Failed: ' + error.message); return; }
        await loadVerificationQueue();
      });
    });
    panel.querySelectorAll('[data-reject]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const note = prompt('Reason for rejection (shown to the user):', 'Document unclear, please re-upload.');
        if(note === null) return;
        const { error } = await supabaseClient.rpc('admin_review_verification', {
          p_profile_id: btn.dataset.reject, p_approve: false, p_note: note
        });
        if(error){ alert('Failed: ' + error.message); return; }
        await loadVerificationQueue();
      });
    });
  }

  // ============================================================
  // CUSTOMERS
  // ============================================================
  async function loadCustomers(){
    const panel = document.getElementById('panel-customers');
    panel.innerHTML = '<p style="color:var(--ink-soft);">Loading…</p>';
    const { data, error } = await supabaseClient.rpc('admin_get_customers');
    if(error){
      panel.innerHTML = '<p style="color:var(--signal);">Could not load customers: ' + error.message + '</p>';
      return;
    }
    customers = data || [];
    renderCustomers();
  }

  function verificationPill(status){
    const labels = { incomplete: 'Profile incomplete', pending: 'Pending review', verified: 'Verified', rejected: 'Rejected' };

  function attachEditFormHandlers(scope){
    scope.querySelectorAll('[data-cancel-edit]').forEach(btn => {

    });
    scope.querySelectorAll('[data-save-edit]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const kind = btn.dataset.saveEdit;
        const id = btn.dataset.id;
        const name = document.getElementById(`ef-name-${kind}-${id}`).value.trim();
        const phone = document.getElementById(`ef-phone-${kind}-${id}`).value.trim();
        const address = document.getElementById(`ef-address-${kind}-${id}`).value.trim();
        const dobStr = document.getElementById(`ef-dob-${kind}-${id}`).value;

        const { error } = await supabaseClient.rpc('admin_update_profile', {
          p_profile_id: id,
          p_name: name || null,
          p_phone: phone || null,
          p_address: address || null,
          p_dob: dobStr || null
        });
        if(error){ alert('Failed to save: ' + error.message); return; }

        if(kind === 'worker'){
          const workerId = btn.dataset.workerId;
          const category = document.getElementById(`ef-category-${workerId}`).value.trim();
          const bio = document.getElementById(`ef-bio-${workerId}`).value.trim();
          const { error: wErr } = await supabaseClient.rpc('admin_update_worker_details', {
            p_worker_id: workerId, p_name: name || null, p_category: category || null, p_bio: bio || null
          });
          if(wErr){ alert('Saved profile, but worker details failed: ' + wErr.message); }
        }

        if(kind === 'customer') await loadCustomers();
        else await loadWorkers();
      });
    });
  }

  // ---------- Password re-confirmation modal (for destructive actions) ----------
  function confirmAdminPassword(title, message){
    return new Promise((resolve) => {
      const overlay = document.getElementById('pwModalOverlay');
      const input = document.getElementById('pwModalInput');
      const errorEl = document.getElementById('pwModalError');
      const confirmBtn = document.getElementById('pwModalConfirm');
      const cancelBtn = document.getElementById('pwModalCancel');

      document.getElementById('pwModalTitle').textContent = title;
      document.getElementById('pwModalMessage').textContent = message;
      input.value = '';
      errorEl.style.display = 'none';
      overlay.classList.add('open');
      setTimeout(() => input.focus(), 50);

      function cleanup(result){
        overlay.classList.remove('open');
        confirmBtn.removeEventListener('click', onConfirm);
        cancelBtn.removeEventListener('click', onCancel);
        input.removeEventListener('keydown', onKeydown);
        resolve(result);
      }

      async function onConfirm(){
        const password = input.value;
        if(!password){
          errorEl.textContent = 'Enter your admin password.';
          errorEl.style.display = 'block';
          return;
        }
        confirmBtn.disabled = true;
        confirmBtn.textContent = 'Checking…';

        const { data: { session } } = await supabaseClient.auth.getSession();
        const { error } = await supabaseClient.auth.signInWithPassword({
          email: session.user.email, password
        });

        confirmBtn.disabled = false;
        confirmBtn.textContent = 'Confirm';

        if(error){
          errorEl.textContent = 'Incorrect password.';
          errorEl.style.display = 'block';
          return;
        }
        cleanup(true);
      }
      function onCancel(){ cleanup(false); }
      function onKeydown(e){ if(e.key === 'Enter') onConfirm(); if(e.key === 'Escape') onCancel(); }

      confirmBtn.addEventListener('click', onConfirm);
      cancelBtn.addEventListener('click', onCancel);
      input.addEventListener('keydown', onKeydown);
    });
  }

  // ---------- Shared delete-profile handler (customers + workers) ----------
  function attachDeleteHandlers(panel){
    panel.querySelectorAll('[data-delete-user]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const name = btn.dataset.deleteName;
        if(!confirm(`Permanently delete ${name}'s entire account? This removes all their profiles, bookings, and history. They CAN sign up again later, but as a brand new account requiring fresh verification. This cannot be undone.`)){
          return;
        }

        const confirmed = await confirmAdminPassword(
          'Confirm deletion',
          `Re-enter your admin password to permanently delete ${name}'s account.`
        );
        if(!confirmed) return;

        const { error } = await supabaseClient.rpc('admin_delete_account', {
          p_profile_id: btn.dataset.deleteUser
        });
        if(error){ alert('Could not delete: ' + error.message); return; }

        alert(name + '\'s account has been deleted.');
        await loadCustomers();
        await loadWorkers();
      });
    });
  }

    const panel = document.getElementById('panel-complaints');
    const filtered = activeFilter === 'all' ? complaints : complaints.filter(c => c.status === activeFilter);
    const list = filtered.length
      ? filtered.map(complaintCard).join('')
      : '<div class="empty-state"><div class="e-icon">✅</div><p>Nothing here.</p></div>';

    panel.innerHTML = `
      <div class="filters">
        <button class="filter-btn" data-filter="pending" aria-selected="${activeFilter==='pending'}">Pending</button>
        <button class="filter-btn" data-filter="suspended" aria-selected="${activeFilter==='suspended'}">Suspended</button>
        <button class="filter-btn" data-filter="dismissed" aria-selected="${activeFilter==='dismissed'}">Dismissed</button>
        <button class="filter-btn" data-filter="all" aria-selected="${activeFilter==='all'}">All</button>
      </div>
      ${list}
    `;

    panel.querySelectorAll('[data-filter]').forEach(btn => {
      btn.addEventListener('click', () => { activeFilter = btn.dataset.filter; renderComplaints(); });
    });
    panel.querySelectorAll('[data-suspend]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Suspend this customer for 7 days?')) return;
        const { error } = await supabaseClient.rpc('admin_suspend_customer', {
          p_customer_id: btn.dataset.customer, p_days: 7, p_complaint_id: btn.dataset.suspend
        });
        if(error){ alert('Failed: ' + error.message); return; }
        await loadComplaints();
      });
    });
    panel.querySelectorAll('[data-dismiss]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Dismiss this complaint with no action?')) return;
        const { error } = await supabaseClient.rpc('admin_dismiss_complaint', { p_complaint_id: btn.dataset.dismiss });
        if(error){ alert('Failed: ' + error.message); return; }
        await loadComplaints();
      });
    });
    panel.querySelectorAll('[data-unsuspend]').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Lift this suspension now?')) return;
        const { error } = await supabaseClient.rpc('admin_unsuspend_customer', { p_customer_id: btn.dataset.unsuspend });
        if(error){ alert('Failed: ' + error.message); return; }
        await loadComplaints();
      });
    });
  }

  async function loadComplaints(){
    const panel = document.getElementById('panel-complaints');
    const { data, error } = await supabaseClient.rpc('admin_get_complaints');
    if(error){
      panel.innerHTML = '<p style="color:var(--signal);">Could not load complaints: ' + error.message + '</p>';
      return;
    }
    complaints = data || [];
    renderComplaints();
  }

  async function init(){
    document.getElementById('logoutBtn').style.display = 'none';

    if(!BACKEND_READY){
      renderGate('<h2>Backend not connected</h2><p>Add your Supabase URL & key at the top of admin.html.</p>');
      return;
    }

    const { data: { session } } = await supabaseClient.auth.getSession();

    // If Google just redirected back here, the URL has a #access_token=...
    // fragment. Supabase has already read it into the session by now —
    // strip it from the address bar so it can never sit in browser
    // history for "Back" to revisit (that stale/expired token confusing
    // the client on restore is what was causing the false "logout").
    if(window.location.hash.includes('access_token')){
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    if(!session){
      // Diagnostic: show exactly what's (or isn't) in storage, so we can
      // see the real cause instead of guessing again.
      let storageKeys = [];
      try{
        storageKeys = Object.keys(localStorage).filter(k => k.startsWith('sb-'));
      } catch(e){ storageKeys = ['(localStorage threw: ' + e.message + ')']; }

      renderLoginGate();
      const debugBox = document.createElement('div');
      debugBox.style.cssText = 'max-width:420px;margin:20px auto 0;padding:12px 14px;background:#fff3cd;border:1px solid #e0c068;border-radius:8px;font-size:0.78rem;color:#5a4a1a;text-align:left;word-break:break-all;';
      debugBox.innerHTML = '<strong>Debug info</strong> (screenshot this):<br>' +
        'Supabase auth keys in storage: ' + (storageKeys.length ? storageKeys.join(', ') : 'NONE FOUND') + '<br>' +
        'URL: ' + window.location.href;
      document.querySelector('.gate').appendChild(debugBox);
      return;
    }

    const { data: isAdmin, error } = await supabaseClient.rpc('is_admin');
    if(error || !isAdmin){
      renderGate('<h2>Not authorized</h2><p>This account (' + session.user.email + ') does not have admin access.</p><button class="btn" id="switchAccountBtn" style="margin-top:14px;">Log out and try another account</button>');
      const switchBtn = document.getElementById('switchAccountBtn');
      if(switchBtn) switchBtn.addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        init();
      });
      return;
    }

    // Authorized — show the tabbed app, the logout button, and load the first tab.
    mainContent.style.display = 'none';
    adminApp.style.display = '';
    document.getElementById('logoutBtn').style.display = '';
    await loadStats();
  }

  document.getElementById('logoutBtn').addEventListener('click', async () => {
    if(!confirm('Log out of the admin panel?')) return;
    await supabaseClient.auth.signOut();
    adminApp.style.display = 'none';
    mainContent.style.display = '';
    init();
  });

  init();
})();
</script>
</body>
</html>
